<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lanternlight</title>
<style>
:root{ --ink:#d6cfc0; --dim:rgba(214,207,192,.6); --panel:rgba(9,9,12,.9); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#030407;color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:16px;left:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  opacity:0;transition:opacity 2s;pointer-events:none}
#hud > *{pointer-events:auto}
body.playing #hud, body.playing #hint{opacity:.85}
.stat{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:rgba(6,6,9,.6);font-size:15px}
.ico{width:9px;height:9px;border-radius:50%;flex:none}
.ico.w{background:#cfe6ee;box-shadow:0 0 7px 2px rgba(170,215,235,.55)}
.ico.s{background:#e07a2c;box-shadow:0 0 7px 2px rgba(225,110,40,.55);border-radius:2px}
.ico.l{background:#a9a394;transform:rotate(45deg);border-radius:1px}
button{font:inherit;color:var(--ink);background:rgba(6,6,9,.6);border:1px solid rgba(214,207,192,.2);
  border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:rgba(225,140,70,.7)}
#hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);
  opacity:0;transition:opacity 2s;padding:0 16px;pointer-events:none}
#toast{position:fixed;top:17%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;
  width:min(560px,calc(100% - 32px))}
.t{opacity:0;transition:opacity 1.4s;margin-bottom:10px}
.t.show{opacity:1}
.t h3{margin:0 0 4px;font-weight:normal;font-size:23px;letter-spacing:.1em;color:#e6dcc6;
  text-shadow:0 0 14px rgba(0,0,0,.9), 0 1px 2px #000}
.t p{margin:0;font-style:italic;color:var(--dim);font-size:15px;text-shadow:0 1px 3px #000}
.t.small h3{font-size:15px;letter-spacing:.06em;color:var(--dim)}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;transition:opacity 2.5s;padding:16px;
  background:radial-gradient(ellipse at center, rgba(3,4,7,.25), rgba(3,4,7,.9))}
#title h1{font-weight:normal;font-size:clamp(38px,7.5vw,78px);letter-spacing:.2em;margin:0;color:#e6dcc6;
  text-shadow:0 0 26px rgba(225,120,50,.35)}
#title p{color:var(--dim);font-style:italic;margin:14px 0 40px;font-size:clamp(15px,2.2vw,18px)}
#title .go{font-size:13px;letter-spacing:.3em;text-transform:uppercase;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
body.playing #title{opacity:0;pointer-events:none}
#journal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(2,2,4,.65);padding:16px}
#journal[hidden]{display:none}
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);
  border:1px solid rgba(214,207,192,.14);border-radius:10px;padding:24px 26px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);touch-action:pan-y;
  scrollbar-width:thin;scrollbar-color:rgba(214,207,192,.25) transparent}
.card h2{margin:0;font-weight:normal;letter-spacing:.14em;color:#e6dcc6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:16px 0 18px}
.stats div{background:rgba(255,255,255,.035);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--dim)}
.stats b{display:block;font-size:20px;color:var(--ink);font-weight:normal}
.lm{padding:10px 0;border-top:1px solid rgba(214,207,192,.08)}
.lm h4{margin:0;font-weight:normal;font-size:16px}
.lm p{margin:2px 0 0;font-size:14px;font-style:italic;color:var(--dim)}
.lm.unk h4{color:rgba(214,207,192,.3)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px;flex-wrap:wrap}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
  border:1px solid rgba(214,207,192,.25);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:rgba(225,150,90,.3)}
#err{position:fixed;inset:auto 16px 16px 16px;color:#ffb0a0;font:13px/1.4 monospace;white-space:pre-wrap}
@media (max-width:600px){ .stat{padding:5px 10px;font-size:14px} #hint{font-size:12px} }
</style>
</head>
<body>
<div id="hud">
  <div class="stat" title="Lights gathered"><span class="ico w"></span><span id="hW">0</span></div>
  <div class="stat" title="Beacons lit"><span class="ico s"></span><span id="hS">1</span></div>
  <div class="stat" title="Places found"><span class="ico l"></span><span id="hL">0/9</span></div>
  <button id="jBtn">Journal</button>
  <button id="mBtn" title="Toggle sound">Sound on</button>
</div>

<div id="toast"></div>
<div id="hint"></div>
<div id="joy"><i></i></div>

<div id="journal" hidden>
  <div class="card">
    <h2>Journal</h2>
    <div class="stats" id="jStats"></div>
    <div id="jList"></div>
    <div class="row">
      <button id="jReset">Start a new walk</button>
      <button id="jClose">Close</button>
    </div>
  </div>
</div>

<div id="title">
  <h1>Lanternlight</h1>
  <p>Nothing out here exists until your light finds it. Almost nothing.</p>
  <div class="go" id="go">Click to begin</div>
</div>
<div id="err"></div>

} }
</script>
<script>
addEventListener('error', e => { document.getElementById('err').textContent = 'Error: ' + (e.message || e.type); });
</script>

scene.add(new THREE.HemisphereLight(0x25324c, 0x08090c, 0.75));
const moonDir = new V3(-0.5, 0.5, -0.6).normalize();
const moonLight = new THREE.DirectionalLight(0x6f84ad, 0.42);

{
  const N = 900, p = new Float32Array(N * 3), c = new Float32Array(N * 3), r = mulberry32(42);
  for (let i = 0; i < N; i++) {

      const w = ch.wisps[i];
      w.x += Math.sin(time * 0.31 + w.ph) * 0.25 * dt; w.z += Math.cos(time * 0.27 + w.ph * 1.7) * 0.25 * dt;
      w.g.position.set(w.x, w.y + Math.sin(time * 1.1 + w.ph) * 0.22, w.z);
      const fl = 0.8 + 0.2 * Math.sin(time * 9 + w.ph) * Math.sin(time * 3.7 + w.ph * 2);
      w.g.children[1].scale.setScalar(1.05 * fl); w.g.children[0].scale.set(0.05, 0.085 * fl, 0.05);
      const dx = ppos.x - w.x, dz = ppos.z - w.z, d = Math.hypot(dx, dz);
      if (!started) continue;
      if (d < 3.0 && d > 0.01) { const pull = (3.0 - d) * 1.3 * dt; w.x += dx / d * pull; w.z += dz / d * pull; }
      if (d < 1.1) {
        ch.wisps.splice(i, 1);
        scene.attach(w.g); w.fly = 0; w.from = w.g.position.clone(); flying.push(w);
        save.wisps.add(w.id); updateHud(); audio.wisp();
        const n = save.wisps.size;
        if (n === 1) toast('Your lantern burns a little brighter', null, true);
        else if (n % 10 === 0) toast(n + ' lights gathered', null, true);
      }
    }
  }
  for (let i = flying.length - 1; i >= 0; i--) {
    const w = flying[i]; w.fly += dt * 2.4;
    const t = Math.min(1, w.fly), e = t * t;
    w.g.position.lerpVectors(w.from, lanternWorld, e); w.g.position.y += Math.sin(t * Math.PI) * 0.5;
    w.g.scale.setScalar(1 - e * 0.8);
    if (t >= 1) { scene.remove(w.g); flying.splice(i, 1); flare = 1; }
  }
}

function updateShrines(dt) {
  for (const ch of chunks.values()) for (const s of ch.shrines) {
    if (s.lit) {
      s.flame.scale.setScalar(2.1 + Math.sin(time * 8 + s.x) * 0.25 + Math.sin(time * 17 + s.z) * 0.14);
      const fc = s.fire.children;
      for (let i = 0; i < fc.length; i++) { const k = 0.7 + 0.3 * Math.sin(time * (11 + i * 3.1) + s.x + i) + 0.2 * Math.sin(time * (23 + i * 5) + i * 2); fc[i].scale.y = 0.4 * (i ? 0.7 : 1) * Math.max(0.3, k); fc[i].rotation.z = Math.sin(time * 6 + i * 2) * 0.12; }
      continue;
    }
    s.ember.scale.setScalar(0.4 + Math.sin(time * 1.6 + s.x) * 0.1);
    if (!started) continue;
    const dx = ppos.x - s.x, dz = ppos.z - s.z;
    if (dx * dx + dz * dz < 2.4 * 2.4) {
      setLit(s); save.shrines.add(s.id); refreshLit(); updateHud(); persist(); audio.kindle(); flare = 0.8;
      if (save.shrines.size === 1) toast('Beacon lit', 'It will hold this place in the light after you have gone.');
      else toast('Beacon lit', null, true);
    }
  }
}

/* --------------------------------------------------------- perf watchdog */
let perfT = 0, perfN = 0, perfDone = false;
function perf(rawDt) {
  if (perfDone || !started || document.hidden) return;
  perfT += rawDt; perfN++;
  if (perfT > 4) {
    if (perfN / perfT < 24) {   // well under 30, so a host that caps a background tab at 30 fps does not trip it
      if (shadowEvery < 3) { shadowEvery = 3; perfT = 0; perfN = 0; return; }
      if (lanternLight.castShadow) { lanternLight.castShadow = false; perfT = 0; perfN = 0; return; }
      renderer.setPixelRatio(1); composer.setPixelRatio(1);
    }
    perfDone = true;
  }
}

/* -------------------------------------------------------------- main loop */
const clock = new THREE.Clock();
updateChunks();
function frame() {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
  time += dt; windU.value = time;
  updatePlayer(dt);
  updateChunks();
  litTimer += dt; if (litTimer > 0.4) { litTimer = 0; refreshLit(); }
  updateLantern(dt);
  updateReveal(dt);
  updateParticles(dt);
  updateWisps(dt);
  updateShrines(dt);
  updateWatchers(dt);
  updateFollower(dt);
  updateCrows(dt);
  updateCamera(dt);
  perf(raw);
  saveTimer += dt; if (saveTimer > 5 && started) { saveTimer = 0; persist(); }
  if (frameN++ % shadowEvery === 0) lanternLight.shadow.needsUpdate = true;
  grade.uniforms.time.value = time; grade.uniforms.dim.value = gutterShape;
  composer.render();
}
renderer.setAnimationLoop(frame);
addEventListener('pagehide', () => { if (started) persist(); });

// small hook for debugging from the console
window.__lantern = { save, chunks, ppos, follower, watchers, bloom, scene, player, crows, mist, composer, renderer, lanternLight, get revealR() { return revealR; }, gutter() { gutterNext = 0; }, summon() { follower.wait = 0; }, cam(y, p, d) { camYaw = y; camPitch = p; camDist = d; }, go(x, z) { ppos.x = x; ppos.z = z; } };
</script>
</body>
